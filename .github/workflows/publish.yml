# Vendored from Final-Commerce/central-ops/.github/workflows/publish-package.yml.
# This repo is PUBLIC and GitHub does not allow public repos to call reusable
# workflows that live in private repos, so we carry a copy instead of `uses:`.
# Trimmed to the public-npm path only (no Artifact Registry, no GCP WIF).
# If central-ops changes its publish logic, re-sync this file by hand.
name: Publish Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version-bump commit push
      id-token: write # npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@final-commerce'
          cache: 'npm'

      - name: Extract and validate semver from tag
        id: version
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}
          VERSION=${RAW_TAG#v}

          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([a-zA-Z0-9]+([._-][a-zA-Z0-9]+)*))?(\+([a-zA-Z0-9]+([._-][a-zA-Z0-9]+)*))?$'
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Tag '$RAW_TAG' is not valid semver: '$VERSION'"
            echo "Expected format: MAJOR.MINOR.PATCH[-prerelease][+build]"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "✅ Valid semver: $VERSION"

      - name: Compare with previous tag
        run: |
          CURRENT="${{ steps.version.outputs.version }}"
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          node -e "
            const { execSync } = require('child_process');

            const CURRENT = '$CURRENT';
            const CURRENT_TAG = '$CURRENT_TAG';
            const SEMVER_REGEX = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([a-zA-Z0-9]+([._-][a-zA-Z0-9]+)*))?(\+([a-zA-Z0-9]+([._-][a-zA-Z0-9]+)*))?$/;

            function parse(v) {
              const i = v.indexOf('-');
              const core = i === -1 ? v : v.substring(0, i);
              const pre = i === -1 ? null : v.substring(i + 1).split('.');
              const [major, minor, patch] = core.split('.').map(Number);
              return { major, minor, patch, pre };
            }

            function cmpId(a, b) {
              const aNum = /^\d+$/.test(a);
              const bNum = /^\d+$/.test(b);
              if (aNum && bNum) return parseInt(a, 10) - parseInt(b, 10);
              if (aNum) return -1;
              if (bNum) return 1;
              return a < b ? -1 : a > b ? 1 : 0;
            }

            function cmp(a, b) {
              const va = parse(a);
              const vb = parse(b);
              if (va.major !== vb.major) return va.major - vb.major;
              if (va.minor !== vb.minor) return va.minor - vb.minor;
              if (va.patch !== vb.patch) return va.patch - vb.patch;
              if (!va.pre && !vb.pre) return 0;
              if (!va.pre) return 1;
              if (!vb.pre) return -1;
              for (let i = 0; i < Math.max(va.pre.length, vb.pre.length); i++) {
                if (i >= va.pre.length) return -1;
                if (i >= vb.pre.length) return 1;
                const c = cmpId(va.pre[i], vb.pre[i]);
                if (c !== 0) return c;
              }
              return 0;
            }

            function normalizeTag(tag) {
              return tag.startsWith('v') ? tag.slice(1) : tag;
            }

            const allRawTags = execSync('git tag --list', { encoding: 'utf8' })
              .split('\n')
              .map((t) => t.trim())
              .filter(Boolean)
              .filter((t) => t !== CURRENT_TAG);

            const allVersions = allRawTags
              .map((t) => normalizeTag(t))
              .filter((v) => SEMVER_REGEX.test(v));

            const currentParsed = parse(CURRENT);
            const currentIsPrerelease = Boolean(currentParsed.pre);
            const currentChannel = currentIsPrerelease ? currentParsed.pre[0].toLowerCase() : null;

            const candidates = allVersions.filter((v) => {
              const parsed = parse(v);
              const isPrerelease = Boolean(parsed.pre);

              if (!currentIsPrerelease) {
                // Stable releases should only compare against prior stable releases.
                return !isPrerelease;
              }

              // Prereleases compare only within the same channel AND same stable base version.
              // This allows parallel beta lines (e.g. 1.0.x-beta and 1.1.x-beta) to coexist.
              if (!isPrerelease) return false;
              const channel = parsed.pre[0].toLowerCase();
              if (channel !== currentChannel) return false;
              return parsed.major === currentParsed.major &&
                parsed.minor === currentParsed.minor &&
                parsed.patch === currentParsed.patch;
            });

            if (candidates.length === 0) {
              console.log('No previous comparable version found for this release channel; skipping comparison.');
              process.exit(0);
            }

            const previous = candidates.sort((a, b) => cmp(b, a))[0];
            const result = cmp(CURRENT, previous);

            console.log('Comparing: ' + CURRENT + ' (new) vs ' + previous + ' (previous comparable)');
            if (result <= 0) {
              console.error('::error::Version ' + CURRENT + ' is not greater than previous comparable version ' + previous);
              process.exit(1);
            }
            console.log('✅ Version ' + CURRENT + ' > ' + previous);
          "

      - name: Determine dist-tag
        id: dist_tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [[ "$VERSION" == *-* ]]; then
            PRE=${VERSION#*-}
            DIST_TAG=$(echo "$PRE" | grep -oE '^[a-zA-Z]+')
            if [ -n "$DIST_TAG" ]; then
              echo "flag=--tag $DIST_TAG" >> $GITHUB_OUTPUT
              echo "Auto-detected dist-tag: $DIST_TAG"
              exit 0
            fi
          fi

          echo "flag=" >> $GITHUB_OUTPUT
          echo "Publishing as 'latest'"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Inject version into package.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "✅ package.json version: $(node -p "require('./package.json').version")"

      - name: Check npm version availability
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_NAME=$(node -p "require('./package.json').name")
          EXISTING=$(npm view "${PKG_NAME}@${VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "::error::${PKG_NAME}@${VERSION} already exists on npm. Resolve the partial publish manually before re-tagging."
            exit 1
          fi
          echo "✅ ${PKG_NAME}@${VERSION} is available on npm"

      - name: Build package
        run: npm run build --if-present

      - name: Verify dist integrity
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            const DIST = 'dist';
            if (!fs.existsSync(DIST)) {
              console.log('No dist/ directory — skipping dist integrity check.');
              process.exit(0);
            }

            function walk(dir, files) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full, files);
                else if (/\.d\.(ts|mts|cts)\$/.test(entry.name)) files.push(full);
              }
              return files;
            }

            const dtsFiles = walk(DIST, []);
            const specifierRegex = /(?:from|require\()\s*['\"](\.[^'\"]+\.(?:js|mjs|cjs))['\"]/g;
            const missing = [];

            for (const file of dtsFiles) {
              const content = fs.readFileSync(file, 'utf8');
              let match;
              while ((match = specifierRegex.exec(content))) {
                const resolved = path.resolve(path.dirname(file), match[1]);
                if (!fs.existsSync(resolved)) {
                  missing.push({ file, specifier: match[1], resolved });
                }
              }
            }

            if (missing.length > 0) {
              console.error('::error::Declaration file(s) reference a runtime chunk that was not emitted:');
              for (const m of missing) {
                console.error('  ' + m.file + \" -> '\" + m.specifier + \"' (expected \" + m.resolved + ')');
              }
              console.error('This usually means the bundler split shared types into a .d.ts-only chunk (e.g. multiple tsup entries sharing types, with no matching .js/.mjs output). A consumer doing static type/enum introspection (e.g. the @nestjs/swagger CLI plugin) can bake a require() to this path and crash at runtime with MODULE_NOT_FOUND, even though a plain import of the package works fine.');
              process.exit(1);
            }

            console.log('✅ Verified ' + dtsFiles.length + ' declaration file(s) in dist/ — no dangling chunk references.');
          "

      - name: Publish to npm
        run: npm publish ${{ steps.dist_tag.outputs.flag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve target branch
        id: target_branch
        run: |
          RELEASE_BRANCH="${{ github.event.release.target_commitish }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          BRANCH="${RELEASE_BRANCH:-$DEFAULT_BRANCH}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Target branch: $BRANCH"

      - name: Commit version bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ steps.target_branch.outputs.branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --package-lock-only --ignore-scripts

          if git diff --quiet package.json package-lock.json; then
            echo "ℹ️ package.json already at version $VERSION — nothing to commit"
            exit 0
          fi

          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin "$BRANCH"
          echo "✅ Committed version $VERSION to $BRANCH"
