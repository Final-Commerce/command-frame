# Publishing @final-commerce/command-frame to npm.
#
# WHAT RUNS THIS
#   Publishing a GitHub Release whose tag is the version, e.g. `v0.6.0-staging.2`.
#   A bare `git push origin v...` does NOT publish — cut a Release.
#
# WHERE THE LOGIC LIVES
#   All the work is in the shared workflow in `Final-Commerce/central-ops`, which
#   common, data-layer, port-louis and kaching also use. This repo used to carry
#   its own ~200-line copy; it drifted from the shared one and wrote prerelease
#   versions into `main` (see the note below). One implementation is the point:
#   a fix in central-ops now reaches every package at once.
#
# WHAT THE SHARED WORKFLOW DOES, IN ORDER
#   1. Reads the version from the tag (`v1.2.3-staging.4` -> `1.2.3-staging.4`)
#      and rejects anything that is not valid semver.
#   2. Refuses to publish unless the version is GREATER than the previous tag in
#      the SAME channel — staging is compared against staging, stable against
#      stable. This is what stops a re-publish or an accidental downgrade.
#   3. Picks the npm dist-tag from the prerelease identifier automatically:
#        0.6.0-staging.2 -> `npm publish --tag staging`
#        0.6.0-preprod.1 -> `npm publish --tag preprod`
#        0.6.0           -> `npm publish`  (i.e. `latest`)
#      So a prerelease can never take over `latest` by accident.
#   4. Publishes to npmjs.org with provenance (this repo is public).
#   5. Commits the version back to the branch the Release was cut FROM
#      (`release.target_commitish`), not blindly to the default branch.
#      That last point is the bug this file used to have: a tag cut from
#      release-staging wrote its `-staging` version into `main`, so `main`
#      claimed `0.6.0-staging.1` while its real version was `0.5.1`.
#
# KNOBS (see central-ops for the full list)
#   dist_tag       — force a dist-tag instead of deriving it from the version
#   version_branch — force where the version-bump commit lands
#   commit_version — set false to skip the version-bump commit entirely

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    permissions:
      contents: write # version-bump commit
      id-token: write # npm provenance + Workload Identity Federation
    uses: Final-Commerce/central-ops/.github/workflows/publish-package.yml@main
    with:
      # @final-commerce is the public npmjs.org scope; the shared workflow routes
      # non-@final-commerce scopes to Artifact Registry instead.
      scope: '@final-commerce'
    secrets: inherit
