name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: Final-Commerce/central-ops/.github/workflows/publish-package.yml@main
    with:
      scope: '@final-commerce'
    secrets: inherit
